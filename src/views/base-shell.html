<div id="shiguang" aria-label="拾光素材整理原型">
 <div class="app-chrome"><button class="brand" data-action="home">拾光</button><span class="prototype-label">原型</span><select id="page-picker" class="page-picker" aria-label="页面预览"></select><button class="button" data-action="toggle-theme" aria-label="切换为暗夜模式" data-tooltip="日间／暗夜">☀</button><button class="button" data-action="toggle-translucency" aria-label="半透明" aria-pressed="true" data-tooltip="半透明">◐</button><button class="button" data-action="choose-folder" aria-label="选择工作区">▱</button><button class="button" data-action="settings" aria-label="设置">⚙</button><button class="button" data-action="help" aria-label="快捷键">?</button></div>
 <input type="file" id="sg-folder" webkitdirectory multiple hidden>
 <div id="sg-page"></div>
 <div id="sg-toast" role="status" aria-live="polite"></div>
</div>
<style>
#shiguang{--paper:light-dark(#f4f5f6,#171b20);--surface:light-dark(#ffffff,#242b33);--ink:light-dark(#17232d,#edf1f5);--muted:light-dark(#66717c,#aab5c0);--line:light-dark(#dce1e5,#3a444f);--accent:light-dark(#2266d4,#79acff);--soft:light-dark(#eaf1fc,#263c58);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--paper);border-radius:24px;overflow:hidden;position:relative;min-height:600px;box-sizing:border-box}
#shiguang *{box-sizing:border-box}#shiguang button,#shiguang input,#shiguang select{font:inherit}#shiguang button{cursor:pointer}#shiguang button:disabled{opacity:.45;cursor:default}#shiguang .app-chrome{display:flex;align-items:center;gap:18px;padding:19px 28px;border-bottom:1px solid var(--line);padding-right:100px;flex-wrap:wrap}#shiguang .brand{background:none;border:0;color:var(--ink);font-size:21px;font-weight:600;padding:0}#shiguang .brand span{font-size:10px;letter-spacing:2.5px;margin-left:9px;color:var(--muted)}#shiguang .prototype-label{font-size:11px;color:var(--muted);flex:1}#shiguang .button{border:1px solid var(--line);padding:10px 16px;border-radius:14px;background:var(--surface);color:var(--ink)}#shiguang .primary{background:var(--accent);border-color:transparent;color:#ffffff!important}#shiguang .muted{color:var(--muted)}#shiguang .glass{background:var(--surface);border:1px solid var(--line);box-shadow:0 7px 24px #0000000a;border-radius:20px}#shiguang h1{font-size:32px;font-weight:550;letter-spacing:-1px;line-height:1.2}#shiguang h2{font-size:23px;font-weight:550}#shiguang h3{font-weight:550}#shiguang .eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}#shiguang #sg-toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:14px;padding:11px 19px;box-shadow:0 8px 30px #0002;max-width:90%;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}#shiguang #sg-toast.visible{opacity:1}#shiguang .setup{max-width:650px;margin:auto;padding:30px}#shiguang .setup label{display:block;margin:18px 0;color:var(--muted)}#shiguang .setup input,#shiguang .setup select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}#shiguang .setup .actions{display:flex;gap:10px;margin-top:24px}#shiguang .stagebar{display:flex;gap:8px;margin:0 28px 18px}#shiguang .stagebar div{flex:1;font-size:11px;color:var(--muted)}#shiguang .stagebar i{display:block;height:4px;background:var(--line);border-radius:4px;margin:7px 0}#shiguang .stagebar .done i{background:var(--accent)}#shiguang .zoomed .review-image{max-height:none!important}#shiguang .key-help{padding:30px;max-width:680px;margin:auto}#shiguang .key-help p{padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){#shiguang .app-chrome{padding:16px;gap:10px;padding-right:80px}#shiguang h1{font-size:26px}#shiguang .prototype-label{flex-basis:100%}#shiguang .stagebar{margin:0 16px 15px}#shiguang .button{min-height:42px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){#shiguang *{transition:none!important;animation:none!important}}
</style>
<style>
#shiguang{border-radius:16px;min-height:460px}#shiguang .app-chrome{padding:12px 24px;padding-right:100px;gap:10px}#shiguang .brand{font-size:15px;font-weight:500}#shiguang .button{border-radius:10px}#shiguang .app-chrome .button{padding:5px 10px}#shiguang .tag-dialog{position:absolute;inset:0;display:grid;place-items:center;background:#0005;z-index:20;padding:16px}#shiguang .tag-dialog form{display:flex;gap:8px;flex-wrap:wrap;max-width:430px;padding:20px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}#shiguang .tag-dialog input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:16px}#shiguang .tag-dialog button:first-of-type{margin-left:auto}#shiguang.zoomed .review-image{transform:scale(1.4)}
@media(max-width:600px){#shiguang .prototype-label{flex-basis:auto}#shiguang .app-chrome{padding:12px 16px;padding-right:85px}}
</style>
